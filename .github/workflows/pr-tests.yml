name: PR Tests

on:
  workflow_call:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "app/**"
      - "bootstrap/**"
      - "config/**"
      - "database/**"
      - "lang/**"
      - "resources/**"
      - "routes/**"
      - "tests/**"
      - "composer.json"
      - "composer.lock"
      - "package.json"
      - "phpunit.xml"
      - "Dockerfile"
      - "docker/**"
      - "compose.yml"
      - ".env.example"
      - "vite.config.js"
      - "tailwind.config.js"
      - "postcss.config.js"
      - "scripts/**"
      - ".github/workflows/pr-tests.yml"
      - ".github/workflows/lint-checks.yml"
      - ".github/workflows/release-image.yml"

permissions:
  contents: read
  actions: write

concurrency:
  group: pr-tests-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  deployment-checks:
    name: Deployment image checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Test deployment checks
        run: python3 -m unittest discover -s tests/deployment -v

      - name: Verify Compose release image
        env:
          REPOSITORY: ${{ github.repository }}
          APP_KEY: ci-placeholder
          SERVICE_URL_APP: http://localhost:8080
          POSTGRES_DB: davvy
          SERVICE_USER_POSTGRES: davvy
          SERVICE_PASSWORD_POSTGRES: ci-placeholder
          DEFAULT_ADMIN_EMAIL: ""
          DEFAULT_ADMIN_PASSWORD: ""
        run: |
          set -euo pipefail
          docker compose --env-file /dev/null -f compose.yml config --format json |
            python3 scripts/deployment_images.py check-config --repository "$REPOSITORY"

  dockerized-tests:
    name: Dockerized Laravel Tests
    needs: deployment-checks
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build CI test image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ci-test
          load: true
          tags: davvy-ci-test:latest
          cache-from: type=gha,scope=ci-test
          cache-to: type=gha,mode=max,scope=ci-test

      - name: Run Dockerized test suite
        run: docker run --rm davvy-ci-test:latest
